<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Password Generator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="card">
  <h2>🔐 Password Generator</h2>
  <p class="subtitle">Generate secure passwords & check entropy</p>

  <form method="post">
    <div class="field">
      <label>Length</label>
      <input
        type="number"
        name="length"
        value="{{ length or 12 }}"
      >
    </div>
    
    <div class="checkboxes">
      <label><input type="checkbox" name="use_lower" {% if use_lower %}checked{% endif %}> Lowercase</label>
      <label><input type="checkbox" name="use_upper" {% if use_upper %}checked{% endif %}> Uppercase</label>
      <label><input type="checkbox" name="use_digits" {% if use_digits %}checked{% endif %}> Digits</label>
      <label><input type="checkbox" name="use_special" {% if use_special %}checked{% endif %}> Symbols</label>
    </div>

    <button type="submit">Generate</button>
  </form>

  {% if password %}
  <div class="result success">
    <div class="password-row">
      <span id="password">{{ password }}</span>
      <button type="button" onclick="copyPassword()" title="Copy">📋</button>
    </div>
    <p class="entropy">Entropy: <b>{{ entropy }}</b></p>
  </div>
  {% endif %}

  {% if errors %}
  <div class="result error">
    {% for e in errors %}
      <p>⚠️ {{ e }}</p>
    {% endfor %}
  </div>
  {% endif %}
</div>

<script src="/static/js/script.js"></script>
</body>
</html>
